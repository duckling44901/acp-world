<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070a12" />
    <title>ACP World</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a12;color:#e9f7f6;font:16px system-ui,sans-serif}
      a{color:#7ee9ed}
    </style>
  </head>
  <body>
    <p>ACP World로 이동 중이에요. <a id="enter" href="./acp-web/">직접 열기</a></p>
    <script>
      const base = location.pathname.endsWith("/") ? location.pathname : `${location.pathname}/`;
      const destination = `${base}acp-web/`;
      document.querySelector("#enter").href = destination;
      location.replace(destination);
    </script>
  </body>
</html>
